<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecting TikTok — SeriesForge</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080c;color:#f5f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:560px;padding:32px;text-align:center}
    p{color:#a8a8b3;line-height:1.6}
    a{color:#c4b5fd}
  </style>
</head>
<body>
  <main>
    <h1>Connecting TikTok…</h1>
    <p id="message">Returning the authorization response to the SeriesForge bridge on this computer.</p>
    <p><a id="fallback" href="#">Continue to the local bridge</a></p>
  </main>
  <script>
    const target = new URL('http://localhost:3455/callback/');
    target.search = window.location.search;

    const fallback = document.getElementById('fallback');
    fallback.href = target.toString();

    if (!window.location.search) {
      document.getElementById('message').textContent =
        'No TikTok authorization response was found. Return to SeriesForge and connect TikTok again.';
    } else {
      window.location.replace(target.toString());
    }
  </script>
</body>
</html>
